name: Verify
'on':
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tokens
        run: python3 tools/test_tokens.py
      - name: Test macOS and compile consumer
        run: |
          ./tools/verify-swift.sh
          swift build --package-path examples/swiftui
          python3 tools/verify_artifacts.py --platform swift
      - name: Build Apple device targets and test iOS Simulator
        run: ./tools/verify-apple.sh
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Install Android SDK packages
        run: |
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          "$RUNNER_TEMP/android-tools/cmdline-tools/bin/android" --no-metrics --sdk "$ANDROID_HOME" sdk install "platforms;android-37"
          "$RUNNER_TEMP/android-tools/cmdline-tools/bin/android" --no-metrics --sdk "$ANDROID_HOME" sdk install "build-tools;36.0.0"
      - name: Test, lint, package, and verify consumers
        run: |
          python3 tools/test_tokens.py
          ./tools/verify-android.sh
          python3 tools/verify_artifacts.py --platform android
