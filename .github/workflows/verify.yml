name: Verify

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.25'
          working_directory: swiftui
      - name: Test macOS
        working-directory: swiftui
        run: mise run test
      - name: Build Apple device targets
        working-directory: swiftui
        run: |
          mise run build -- --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios16.0 --scratch-path .build/ios
          mise run build -- --sdk "$(xcrun --sdk appletvos --show-sdk-path)" --triple arm64-apple-tvos16.0 --scratch-path .build/tvos
          mise run build -- --sdk "$(xcrun --sdk watchos --show-sdk-path)" --triple arm64_32-apple-watchos9.0 --scratch-path .build/watchos
      - name: Test iOS Simulator
        working-directory: swiftui
        run: |
          xcodebuild test -scheme TailwindNative -destination "platform=iOS Simulator,name=iPhone Duo,OS=27.1"

  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.25'
          working_directory: jetpackcompose
      - name: Test, lint, and package
        working-directory: jetpackcompose
        run: |
          mise run test
          mise run build
          mise run lint
